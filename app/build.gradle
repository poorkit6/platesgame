plugins {
    id 'com.android.application'
}

android {
    namespace 'com.platesgame.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.platesgame.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.6.1'
    }

    // постоянный ключ: новые версии APK устанавливаются поверх старой без удаления игры
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписываем отладочным ключом, чтобы release-APK можно было сразу установить на телефон
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
